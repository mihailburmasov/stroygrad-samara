name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Сборщик — PHP (он же работает в админке на хостинге); PHP уже есть в образе ubuntu-latest.
      # Node нужен только для проверки ссылок, npm install не требуется.
      - name: Build
        run: php app/bin/build.php && touch dist/.nojekyll
      - name: Check (ссылки, ассеты, SEO-разметка)
        run: node scripts/check.mjs
        env:
          SITE_BASE: ${{ vars.SITE_BASE || '/stroygrad-samara' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
